<style>
  :root { --bg:#120f2b; --card:#1d1840; --card2:#171335; --text:#ece9ff; --muted:#b3aad8; --border:#352d6b;
    --accent:#7b5cff; --accent2:#3f6dff; --tag-bg:#2b2360; --tag-text:#cdbdff;
    --ok:#5fd3a5; --warn:#ffc46b; --bad:#ff7d9a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system, BlinkMacSystemFont, "DM Sans", "Segoe UI", Roboto, sans-serif; color:var(--text); line-height:1.6;
    background: radial-gradient(1200px 600px at 20% -10%, #2a1d63 0%, transparent 60%), radial-gradient(900px 500px at 110% 10%, #13306b 0%, transparent 55%), var(--bg); min-height:100vh; }
  a { color:#a9b8ff; }
  .wrap { max-width:1040px; margin:0 auto; padding:0 24px 80px; }
  /* top bar */
  .topbar { position:sticky; top:0; z-index:5; background:rgba(18,15,43,.85); backdrop-filter:blur(8px); border-bottom:1px solid var(--border); }
  .topbar .wrap { display:flex; align-items:center; gap:20px; padding-top:12px; padding-bottom:12px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; font-size:22px; font-weight:700; letter-spacing:-.02em; color:var(--text); text-decoration:none; }
  .brand svg { width:30px; height:30px; }
  nav { display:flex; gap:4px; flex-wrap:wrap; }
  nav a { color:var(--muted); text-decoration:none; font-weight:600; font-size:14px; padding:6px 12px; border-radius:8px; }
  nav a:hover { color:var(--text); background:var(--tag-bg); }
  nav a.on { color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
  .store { margin-left:auto; font-size:12px; color:var(--muted); }
  /* common */
  h1 { font-size:44px; line-height:1.1; letter-spacing:-.03em; margin:0 0 16px; }
  h2 { font-size:22px; margin:0 0 12px; letter-spacing:-.01em; }
  h3 { font-size:16px; margin:0 0 6px; }
  p { margin:0 0 12px; }
  .muted { color:var(--muted); }
  .small { font-size:13px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:22px 24px; margin-bottom:20px; box-shadow:0 8px 30px rgba(5,3,20,.35); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .spread { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
  .btn { font:inherit; font-weight:600; font-size:14px; padding:9px 16px; border-radius:9px; cursor:pointer; border:1px solid transparent;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; text-decoration:none; display:inline-block; }
  .btn:hover { filter:brightness(1.08); }
  .btn:disabled { opacity:.45; cursor:not-allowed; filter:none; }
  .btn.sec { background:var(--card2); color:var(--text); border-color:var(--border); }
  .btn.small { font-size:13px; padding:5px 11px; }
  .btn.ok { background:#1f4d40; border-color:#2f7a63; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  input[type=text], input[type=password], textarea, select { font:inherit; color:var(--text); background:var(--card2); border:1px solid var(--border); border-radius:9px; padding:8px 11px; width:100%; }
  textarea { resize:vertical; }

  .pill.high { background:#4a1e36; color:var(--bad); } .pill.medium { background:#4a3a17; color:var(--warn); } .pill.low { background:#1d3b47; color:#8fd3ff; }
  .pill.approved { background:#173f33; color:var(--ok); } .pill.dismissed { background:#2a2745; color:var(--muted); }
  .banner { background:var(--tag-bg); color:var(--tag-text); border-radius:10px; padding:10px 14px; margin-bottom:16px; font-size:14px; }
  .banner.err { background:#4a1e36; color:#ffd0dc; }
  .spin { display:inline-block; width:12px; height:12px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:sp .8s linear infinite; vertical-align:-1px; margin-right:6px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  /* home */
  .hero { padding:56px 0 28px; display:grid; grid-template-columns:1.2fr .8fr; gap:32px; align-items:center; }
  @media (max-width:820px) { .hero { grid-template-columns:1fr; } h1 { font-size:34px; } }
  .hero .lead { font-size:19px; color:var(--muted); margin-bottom:22px; }
  .hero-quill { width:100%; max-width:280px; justify-self:center; filter:drop-shadow(0 20px 40px rgba(123,92,255,.35)); }
  .feature h3 { display:flex; align-items:center; gap:8px; }
  .feature .ic { width:30px; height:30px; border-radius:8px; display:grid; place-items:center; background:var(--tag-bg); color:var(--tag-text); font-size:16px; }
  ol.steps { counter-reset:s; list-style:none; padding:0; margin:0; }
  ol.steps li { counter-increment:s; position:relative; padding:0 0 16px 46px; }
  ol.steps li::before { content:counter(s); position:absolute; left:0; top:0; width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-weight:700;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); }
  /* manuscript */
  .editor { min-height:420px; height:55vh; line-height:1.7; }
  .dropzone.drag .editor { border-color:var(--accent); border-style:dashed; background:var(--tag-bg); }
  /* bible */
  .bcard { background:var(--card2); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
  .bcard .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .bcard .three { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .x { float:right; background:none; border:0; color:var(--muted); cursor:pointer; font-size:18px; line-height:1; }
  .x:hover { color:var(--bad); }
  /* report */
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin:6px 0 16px; flex-wrap:wrap; }
  .tabs button { font:inherit; font-weight:600; font-size:14px; background:none; border:0; color:var(--muted); padding:9px 14px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabs button.on { color:var(--text); border-bottom-color:var(--accent); }
  .tabs .n { font-size:11px; background:var(--tag-bg); color:var(--tag-text); padding:1px 7px; border-radius:999px; margin-left:4px; }
  .progress { height:8px; background:var(--card2); border-radius:999px; overflow:hidden; border:1px solid var(--border); }
  .progress > div { height:100%; background:linear-gradient(90deg,var(--ok),#3fb6d0); }
  .finding { background:var(--card2); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .finding.approved { border-color:#2f7a63; } .finding.dismissed { opacity:.6; }
  .quote { font-family:Georgia, serif; font-size:14.5px; border-left:3px solid var(--accent); background:rgba(123,92,255,.08); padding:6px 10px; border-radius:6px; margin:6px 0; }
  .upd { font-size:13.5px; background:rgba(63,109,255,.1); border:1px dashed #4a63b8; border-radius:8px; padding:6px 10px; margin:8px 0; }
  .stat { background:var(--card2); border:1px solid var(--border); border-radius:12px; padding:14px; }
  .stat b { display:block; font-size:26px; }
  /* history */
  .tl { border-left:2px solid var(--border); margin-left:8px; padding-left:20px; }
  .tl .item { position:relative; margin-bottom:16px; }
  .tl .item::before { content:""; position:absolute; left:-27px; top:6px; width:12px; height:12px; border-radius:50%; background:var(--accent); border:2px solid var(--bg); }
  .tl .item.bible::before { background:var(--accent2); }
  .diff { font-family:Georgia, serif; font-size:14px; max-height:420px; overflow:auto; background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .diff div { padding:3px 8px; border-radius:4px; margin:2px 0; white-space:pre-wrap; }
  .diff .add { background:rgba(95,211,165,.14); border-left:3px solid var(--ok); }
  .diff .del { background:rgba(255,125,154,.12); border-left:3px solid var(--bad); text-decoration:line-through; text-decoration-color:rgba(255,125,154,.5); }
  .diff .same { color:var(--muted); font-style:italic; font-family:inherit; font-size:13px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#2b2360; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; display:none; z-index:20; box-shadow:0 8px 24px rgba(0,0,0,.4); }
  .toast.show { display:block; }

  /* ---- workspace: 3 panes ---- */
  body.ws .wrap#view { max-width:none; padding:0; }
  .ws-banner { position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:6; min-width:320px; }
  .workspace { display:grid; grid-template-columns:260px minmax(0,1fr) 380px; height:calc(100vh - 61px); }
  @media (max-width:1000px) { .workspace { grid-template-columns:1fr; height:auto; } .pane { max-height:none !important; } }
  .pane { overflow-y:auto; max-height:calc(100vh - 61px); }
  .side { background:#16123a; border-right:1px solid var(--border); padding:16px; display:flex; flex-direction:column; }
  .side-h { font-weight:700; font-size:18px; margin-bottom:8px; }
  .small-h { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:14px 0 6px; }
  .side-meta { font-size:12.5px; color:var(--muted); margin:4px 0; }
  .title-in { font-weight:600; }
  .chlist { flex:1; overflow-y:auto; margin:0 -6px; }
  .ch { display:flex; gap:10px; width:100%; text-align:left; background:none; border:0; color:var(--text); font:inherit; font-size:14px; padding:8px 10px; border-radius:8px; cursor:pointer; }
  .ch span { color:var(--muted); min-width:16px; }
  .ch:hover { background:var(--tag-bg); }
  .side-foot { border-top:1px solid var(--border); padding-top:12px; margin-top:10px; }
  .center { display:flex; flex-direction:column; background:#1a1640; }
  .center-bar { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--border); background:#16123a; position:sticky; top:0; z-index:2; }
  .doc-title { font-size:15px; }
  .seg { display:flex; background:var(--card2); border:1px solid var(--border); border-radius:9px; padding:3px; }
  .seg button { font:inherit; font-size:13px; font-weight:600; background:none; border:0; color:var(--muted); padding:5px 12px; border-radius:7px; cursor:pointer; }
  .seg button.on { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; }
  .seg button:disabled { opacity:.4; cursor:not-allowed; }
  .paper-wrap { flex:1; overflow-y:auto; padding:28px 20px 60px; }
  .paper { max-width:760px; margin:0 auto; background:#f7f5ff; color:#1f1a3a; border-radius:6px; box-shadow:0 10px 40px rgba(0,0,0,.4); min-height:100%; }
  .paper-edit { width:100%; min-height:calc(100vh - 200px); border:0; background:transparent; color:#1f1a3a; font:18px/1.75 Georgia,"Iowan Old Style",serif; padding:48px 56px; resize:none; border-radius:6px; }
  .paper-edit:focus-visible { outline:none; }
  .dropzone.drag { outline:3px dashed var(--accent); }
  .paper-read { font:18px/1.75 Georgia,"Iowan Old Style",serif; padding:48px 56px; }
  .paper-read p { margin:0 0 14px; color:#1f1a3a; }
  .paper-read h2.chap { font:600 24px/1.3 Georgia,serif; color:#4b3bb0; margin:28px 0 14px; }
  .paper-read mark { background:rgba(123,92,255,.16); color:inherit; border-bottom:2px solid #7b5cff; border-radius:2px; cursor:pointer; padding:0 1px; }
  .paper-read mark.high { border-bottom-color:#e0466c; background:rgba(224,70,108,.12); }
  .paper-read mark.medium { border-bottom-color:#d99b1f; background:rgba(217,155,31,.14); }
  .paper-read mark.sel { background:#ffd76b; border-bottom-color:#b8860b; }
  mark.flash { animation:fl 1.2s ease 1; }
  @keyframes fl { 0%,60% { box-shadow:0 0 0 4px rgba(123,92,255,.6); } 100% { box-shadow:none; } }
  .stale { background:#fff1c9; color:#5a4300; font:14px/1.5 -apple-system,"Segoe UI",sans-serif; padding:10px 14px; border-radius:6px 6px 0 0; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .sugg { background:#16123a; border-left:1px solid var(--border); padding:16px; }
  .sugg-h { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; font-size:18px; }
  .ctabs { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:10px; }
  .ctabs button { font:inherit; font-size:12.5px; font-weight:600; background:var(--card2); color:var(--muted); border:1px solid var(--border); border-radius:999px; padding:4px 10px; cursor:pointer; }
  .ctabs button.on { color:#fff; border-color:var(--accent); background:var(--tag-bg); }
  .ctabs .n { margin-left:5px; font-size:11px; color:var(--tag-text); }
  .pager { display:flex; justify-content:space-between; align-items:center; font-size:14px; margin:6px 0 10px; }
  .iconbtn { width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:var(--card2); color:var(--text); font-size:18px; line-height:1; cursor:pointer; display:grid; place-items:center; }
  .iconbtn:hover { border-color:var(--accent); }
  .iconbtn:disabled { opacity:.35; cursor:not-allowed; }
  .iconbtn.ok { background:#1f4d40; border-color:#2f7a63; color:#bff3dc; }
  .iconbtn.no { background:#4a1e36; border-color:#7a2f4d; color:#ffd0dc; }
  .scard { background:var(--card); border:1px solid var(--accent); border-radius:12px; padding:14px; box-shadow:0 8px 24px rgba(5,3,20,.35); }
  .scard.approved { border-color:#2f7a63; } .scard.dismissed { border-color:var(--border); opacity:.8; }
  .squote { display:block; width:100%; text-align:left; font:14px/1.5 Georgia,serif; color:var(--text); background:rgba(123,92,255,.1); border:0; border-left:3px solid var(--accent); border-radius:6px; padding:6px 10px; margin:6px 0; cursor:pointer; }
  .squote:hover { background:rgba(123,92,255,.2); }
  .slist { margin-top:12px; display:flex; flex-direction:column; gap:4px; }
  .srow { display:flex; align-items:center; gap:8px; text-align:left; font:inherit; font-size:13.5px; color:var(--text); background:var(--card2); border:1px solid var(--border); border-radius:8px; padding:8px 10px; cursor:pointer; }
  .srow:hover { border-color:var(--accent); }
  .dot { width:8px; height:8px; border-radius:50%; background:#8fd3ff; flex:none; }
  .dot.high { background:var(--bad); } .dot.medium { background:var(--warn); }
  .empty-s { background:var(--card2); border:1px dashed var(--border); border-radius:12px; padding:16px; }
  /* sign-in */
  .who { display:flex; align-items:center; gap:10px; }
  .who-email { font-size:13px; color:var(--text); max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .store { margin-left:auto; }
  .signin { min-height:calc(100vh - 140px); display:grid; place-items:center; padding:40px 0; }
  .signin-card { width:100%; max-width:440px; padding:32px; }

  .home { padding:48px 0 60px; display:grid; place-items:center; }
  .home-card { width:100%; max-width:680px; padding:36px 40px; }
  .home-title { text-align:center; font-size:34px; margin:0 0 8px; }
  /* suggestions: big tabs, options, grammar fix, recent changes */
  .tabs6 { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:2px 0 12px; }
  .tab6 { display:flex; justify-content:space-between; align-items:center; gap:8px; font:inherit; font-size:13.5px; font-weight:600; text-align:left;
    background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:10px 12px; cursor:pointer; }
  .tab6:hover { border-color:var(--accent); }
  .tab6.on { background:linear-gradient(135deg,var(--accent),var(--accent2)); border-color:transparent; color:#fff; box-shadow:0 6px 18px rgba(123,92,255,.35); }
  .tab6.tab-g { grid-column:1 / -1; border-color:var(--warn); }
  .tab6.tab-g.on { border-color:transparent; }
  .tn { min-width:24px; text-align:center; font-size:12px; font-weight:700; padding:1px 7px; border-radius:999px; background:var(--bad); color:#fff; }
  .tn.zero { background:transparent; color:var(--muted); border:1px solid var(--border); }
  .tab6.on .tn { background:rgba(255,255,255,.22); color:#fff; border-color:transparent; }
  .choose-h { font-size:13px; font-weight:600; color:var(--text); margin:4px 0 6px; }
  .opts { display:flex; flex-direction:column; gap:6px; }
  .opt { display:flex; align-items:center; gap:10px; font:inherit; font-size:14px; font-weight:600; text-align:left; color:var(--text); background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; cursor:pointer; }
  .opt:hover { border-color:var(--ok); background:#173f33; }
  .opt small { color:var(--muted); font-weight:400; }
  .radio { width:16px; height:16px; border-radius:50%; border:2px solid var(--muted); flex:none; }
  .opt:hover .radio { border-color:var(--ok); background:radial-gradient(circle, var(--ok) 0 4px, transparent 5px); }
  .gfix { display:grid; gap:6px; margin:6px 0; font:14px/1.5 Georgia,serif; }
  .gfix > div { background:var(--card2); border-radius:8px; padding:6px 10px; }
  .gfix small { display:block; font:600 11px/1.4 -apple-system,"Segoe UI",sans-serif; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .gfix .old { text-decoration:line-through; text-decoration-color:rgba(255,125,154,.7); }
  .gfix .new { color:var(--ok); }
  .linkbtn { font:inherit; font-size:12px; font-weight:600; background:none; border:0; color:#a9b8ff; cursor:pointer; padding:0; text-transform:none; letter-spacing:0; }
  .linkbtn:hover { text-decoration:underline; }
  .edits { max-height:180px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; margin-bottom:6px; }
  .edit { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; background:var(--card2); border:1px solid var(--border); border-radius:8px; padding:6px 8px; font-size:12.5px; }
  .edit span { display:block; }
  .edit small { color:var(--muted); }
  .scard.fixed, .scard.resolved { border-color:#2f7a63; }
